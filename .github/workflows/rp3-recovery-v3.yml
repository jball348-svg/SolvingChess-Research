name: RP3 Recovery V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rp3-recovery-v3.yml'

permissions:
  contents: write

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen dependency
        run: python -m pip install -r pilot/requirements.txt

      - name: Verify recovery controls
        run: |
          mkdir -p pilot/.work
          python -m unittest discover -s pilot/tests -v

      - name: Materialize hash-verified original RP3 evidence
        env:
          PYTHONPATH: pilot/src
        run: python pilot/src/rp3_unpack.py

      - name: Record execution host
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, os, platform, sys
          from pathlib import Path
          out = Path('pilot/evidence/rp3-recovery-v3')
          out.mkdir(parents=True, exist_ok=True)
          cpu = next((l.split(':',1)[1].strip() for l in Path('/proc/cpuinfo').read_text().splitlines() if l.startswith('model name')), None)
          def read(path):
              p=Path(path)
              return p.read_text().strip() if p.exists() else None
          data = {
              'recorded_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'python': sys.version,
              'executable': sys.executable,
              'platform': platform.platform(),
              'cpu': cpu,
              'affinity': sorted(os.sched_getaffinity(0)),
              'memory_max': read('/sys/fs/cgroup/memory.max'),
              'cpu_max': read('/sys/fs/cgroup/cpu.max'),
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
              'runner_name': os.environ.get('RUNNER_NAME'),
              'github_sha': os.environ.get('GITHUB_SHA'),
              'frozen_source_commit': '3af88ab121b0fd7fc4bd28147351b1b74551f024',
              'note': 'Execution resumed after chat-session scratch loss. Frozen RP3-MR1-V3 solver, cohorts, libraries, budgets and gates are unchanged; host timing is not normalized against prior sessions.'
          }
          (out/'execution-host.json').write_text(json.dumps(data,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Run frozen RP3-MR1-V3 schedule
        env:
          PYTHONPATH: pilot/src
        run: |
          python pilot/src/rp3_recovery_campaign_v3.py run \
            --output pilot/evidence/rp3-recovery-v3 \
            --commit 3af88ab121b0fd7fc4bd28147351b1b74551f024

      - name: Validate and pack evidence
        env:
          PYTHONPATH: pilot/src
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          from rp3_durable_v3 import validate
          base=Path('pilot/evidence/rp3-recovery-v3')
          seq=json.loads((base/'sequence.json').read_text())
          assert len(seq)==72, len(seq)
          checks={}
          for e in seq:
              d=base/e['label']
              checks[e['label']]=validate(d, 24 if e['label'].startswith('acquire-') else 16)
          assert (base/'execution-complete.json').exists()
          files={}
          for p in sorted(base.rglob('*')):
              if p.is_file():
                  files[str(p.relative_to(base))]={
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                      'bytes': p.stat().st_size,
                  }
          (base/'validation.json').write_text(json.dumps({
              'status':'COMPLETE','processes':len(seq),'validated':len(checks),
              'files':files,
          },sort_keys=True,separators=(',',':'))+'\n')
          with tarfile.open('rp3-recovery-v3-evidence.tar.gz','w:gz') as tf:
              tf.add(base,arcname='rp3-recovery-v3')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: rp3-recovery-v3-evidence
          path: |
            pilot/evidence/rp3-recovery-v3
            rp3-recovery-v3-evidence.tar.gz
          compression-level: 0
          retention-days: 7

      - name: Publish compact validated measurement record
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, shutil, tarfile
          from pathlib import Path
          base=Path('pilot/evidence/rp3-recovery-v3')
          seq=json.loads((base/'sequence.json').read_text())
          labels=[e['label'] for e in seq]
          raw=base/'raw-evidence.tar.gz'
          with tarfile.open(raw,'w:gz') as tf:
              for label in labels:
                  tf.add(base/label,arcname='pilot/evidence/rp3-recovery-v3/'+label)
          members=[]
          with tarfile.open(raw,'r:gz') as tf:
              for m in tf.getmembers():
                  if m.isfile():
                      members.append(m.name)
          manifest={
              'schema':1,
              'archive':'raw-evidence.tar.gz',
              'sha256':hashlib.sha256(raw.read_bytes()).hexdigest(),
              'bytes':raw.stat().st_size,
              'processes':len(labels),
              'file_members':len(members),
              'validation':'validation.json',
              'note':'All 72 final RP3-MR1-V3 process directories; extract under repository root and verify against validation.json.'
          }
          (base/'raw-evidence-manifest.json').write_text(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n')
          for label in labels:
              shutil.rmtree(base/label)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pilot/evidence/rp3-recovery-v3
          git commit -m "RP3: publish final immutable recovery measurements"
          git push origin HEAD:main
